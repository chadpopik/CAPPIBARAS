params:
    # Cosmological, fixed
    hh: {value: 0.7}
    Omega_L: {value: 0.75}
    Omega_m: {value: 0.25}
    Omega_b: {value: 0.044}
    T_CMB: {value: 2.725}
    XH: {value: 0.76}
    v_rms: {value: 1.06e-3}  # v_rms/c

    # GNFW Amplitude
    P0: {ref: 2, prior: {min: 0.5, max: 5}, latex: 'P_0'}
    # Outer slope
    beta_t: {ref: 2.6, prior: {min: 2, max: 4.5}, latex: '\beta_t'}
    # Two-halo Amplitude
    A2h_t: {ref: 1, prior: {min: 0.1, max: 5}, latex: 'A_{2h, t}'}


sampler:
    mcmc:
        Rminus1_stop: 0.01
        max_tries: 200d
        output_every: 10s
    #minimize:
    #  ignore_prior: True

output: chains/RiedGuachalla2025/testing_theory
output_options: 
  columns:
    add_chain: True

debug: False