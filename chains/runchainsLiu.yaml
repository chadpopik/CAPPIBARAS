sampler:
    mcmc:
        Rminus1_stop: 0.01
        max_tries: 200d
        output_every: 10s
    #minimize:
    #  ignore_prior: True


output: chains/Liu2025/testing_theory
output_options: 
  columns:
    add_chain: True

debug: False

params:
    # Cosmological, fixed
    hh: {value: 0.7}
    Omega_L: {value: 0.75}
    Omega_m: {value: 0.25}
    Omega_b: {value: 0.044}
    T_CMB: {value: 2.725}
    XH: {value: 0.76}
    v_rms: {value: 1.06e-3} # v_rms/c

    # GNFW Amplitude
    P0_A0: {ref: 1, prior: {min: 1, max: 5}, latex: 'P_0^{A_0}'}
    P0_alpham: {value: 0}
    P0_alphaz: {ref: -0.8, prior: {min: -1, max: 1}, latex: 'P_0^{\alpha_z}'}
    # Intermediate Slope
    alpha_A0: {ref: 0.9, prior: {min: 0.1, max: 1}, latex: '\alpha_t^{A_0}'}
    alpha_alpham: {value: 0}
    alpha_alphaz: {value: 0}
    # Outer slope
    beta_pres_A0: {ref: 2.9, prior: {min: 1, max: 10}, latex: '\beta_t^{A_0}'}
    beta_pres_alpham: {value: 0}
    beta_pres_alphaz: {value: 0}
    # Core Radius
    xc_A0: {ref: 0.7, prior: {min: 0.5, max: 10}, latex: 'x_{c, t}'}
    xc_alpham: {value: 0}
    xc_alphaz: {value: 0}
    # Two-halo Amplitude
    A2h_t: {ref: 1, prior: {min: 0.5, max: 10}, latex: 'A_{2h, t}'}

    


shared:
    profile:
        name: 'Popik2025'
        spefs: {}
    HaloModel:
        name: 'pyccl'
        spefs: {'mfunc':'Tinker08', 'mdef':'200c', 'hbias': 'Tinker10'}
    yaml_file: "/global/homes/c/cpopik/CAPPIBARAS/chains/runchainsLiu.yaml"


