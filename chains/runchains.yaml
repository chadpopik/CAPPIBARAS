shared:
    onehalo:
        name: 'Amodeo2021'
        spefs: {'model': 'GNFW'}
    twohalo:
        name: 'Amodeo2021'
        spefs: {'model': 'GNFW'}
    DustModel:
        name: 'Amodeo2021'
        spefs: {'model': 'ACT+Hershel'}
    HaloModel:
        name: 'pyccl'
        spefs: {'mfunc':'Tinker08', 'mdef':'200c', 'hbias': 'Tinker10'}

likelihood:
    zbin1:
        measurement:
            name: 'Liu2025'
            spefs: {'zbin':'1', 'DR':'DR6', 'Beta':'1.2', 'dp':'dBeta', 'TCIB':'10.7'}
        SMF:
            name: 'Liu2025'
            spefs: {'zbin':'1'}
        HOD:
            name: 'Yuan2023'
            spefs: {'sample':'LRG 0.4<z<0.6'}