likelihood:
  tSZ150:
    class: SOLikelihoods.TSZLikelihood
    measurement:
      name: Schaan2021
      spefs:
        freq: '150'
        sample: cmass
  tSZ090:
    class: SOLikelihoods.TSZLikelihood
    measurement:
      name: Schaan2021
      spefs:
        freq: 090
        sample: cmass
params:
  hh:
    value: 0.7
  Omega_L:
    value: 0.75
  Omega_m:
    value: 0.25
  Omega_b:
    value: 0.044
  T_CMB:
    value: 2.725
  XH:
    value: 0.76
  v_rms:
    value: 0.00106
  P0:
    latex: P_0^{A_0}
    ref: 2
    prior:
      min: 1
      max: 5
  alpha_t:
    latex: \alpha_t^{A_0}
    ref: 0.8
    prior:
      min: 0.1
      max: 1
  beta_t:
    latex: \beta_t^{A_0}
    ref: 2.6
    prior:
      min: 1
      max: 10
  A2h_t:
    latex: A_{2h, t}
    ref: 3
    prior:
      min: 0.5
      max: 10
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_tries: 200d
    output_every: 10s
output: Schaantest
output_options:
  columns:
    add_chain: true
shared:
  onehalo:
    name: Amodeo2021
    spefs:
      model: GNFW
  twohalo:
    name: Amodeo2021
    spefs:
      model: GNFW
  DustModel:
    name: Amodeo2021
    spefs:
      model: ACT+Hershel
  HaloModel:
    name: pyccl
    spefs:
      mfunc: Tinker08
      mdef: 200c
      hbias: Tinker10
  HOD:
    name: Kou2023
    spefs:
      sample: M*>10.8
  SMF:
    name: Schaan2021
    spefs:
      sample: CMASS
